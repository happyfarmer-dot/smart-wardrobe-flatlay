[project]
name = "atelier-wardrobe-backend"
version = "0.1.0"
description = "Low-token hybrid smart wardrobe backend (FastAPI + PostgreSQL + Gemini 2.5 Flash)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
